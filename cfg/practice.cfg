// practice.cfg
// Works offline with no plugins. Start "Practice with bots" on any map,
// open the console and type: exec practice

sv_cheats 1
mp_warmup_end
mp_limitteams 0
mp_autoteambalance 0
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_maxmoney 60000
mp_startmoney 60000
mp_buytime 9999
mp_buy_anywhere 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_ignore_round_win_conditions 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 6
sv_showimpacts 1
sv_showimpacts_time 5
bot_kick
bot_stop 1
bot_dont_shoot 1
mp_restartgame 1

// Handy binds
bind "n" "noclip"
bind "z" "sv_rethrow_last_grenade"
bind "x" "bot_place"
bind "c" "bot_kick"
bind "v" "give weapon_smokegrenade; give weapon_flashbang; give weapon_hegrenade; give weapon_molotov"

echo "Practice ON. N noclip, Z rethrow, X place bot, C kick bots, V give nades."
