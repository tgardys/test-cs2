// practice_off.cfg
// Puts the server back to normal rules. Type: exec practice_off

sv_infinite_ammo 0
sv_grenade_trajectory_prac_pipreview 0
sv_showimpacts 0
mp_buy_anywhere 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_ignore_round_win_conditions 0
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_freezetime 15
mp_buytime 20
mp_maxmoney 16000
mp_startmoney 800
bot_stop 0
bot_dont_shoot 0
sv_cheats 0
unbind "n"
unbind "z"
unbind "x"
unbind "c"
unbind "v"
mp_restartgame 1
echo "Practice OFF."
