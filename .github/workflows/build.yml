name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet publish plugin/PracticeMode -c Release -o out/addons/counterstrikesharp/plugins/PracticeMode
      - uses: actions/upload-artifact@v4
        with:
          name: PracticeMode
          path: out/
